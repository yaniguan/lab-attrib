name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: python-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest numpy
      - name: Run pytest suite
        run: pytest -v
      - name: Run CLI showcase
        run: |
          lab-attrib demo
          lab-attrib demo --json > /dev/null
          lab-attrib attribute --json > /dev/null

  lean-proofs:
    name: lean-proofs (v4.36.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build LabAttribLean and lab-attrib-lean CLI (zero sorry, zero warnings)
        working-directory: lean
        run: lake build
      - name: Run compiled Lean --batch-tsv vs Python runtime parity suite
        env:
          LAB_ATTRIB_REQUIRE_LEAN_BIN: "1"
        run: |
          python -m pip install -e . pytest
          ./lean/.lake/build/bin/lab-attrib-lean --self-test
          pytest tests/test_blame_and_lean_parity.py -v
