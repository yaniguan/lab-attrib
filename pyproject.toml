[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-attrib"
version = "0.1.0"
description = "Post-execution causal blame calculus, precursor ghost-peak deconvolution, and proof-carrying negative results in Python + Lean 4."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yani Guan"},
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
accel = [
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "numpy>=1.24",
]

[project.scripts]
lab-attrib = "lab_attrib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
